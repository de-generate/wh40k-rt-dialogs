<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rogue Trader dialog explorer</title>
    <script>
      // Apply the stored theme before the first paint; src/state.ts takes over once the app loads.
      try {
        const theme = JSON.parse(localStorage.getItem("theme"));
        if (typeof theme === "string") document.documentElement.dataset.theme = theme;
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
